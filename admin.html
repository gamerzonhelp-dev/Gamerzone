<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#050d0b">
<title>GAMERZONE Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>

:root{--bg:#050d0b;--panel:#10151b;--card:#1a1f29;--field:#0d1015;--line:#2a303c;--text:#f2f5f7;--muted:#8a919e;--green:#00ff88;--green-d:#0a3a29;--amber:#ffd66b;--amber-d:#3a2d08;--red:#ff6b6b;--red-d:#3a1616;--blue:#8fb4ff;--blue-d:#14223d;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0,#0b2a20 0,var(--bg) 60%) fixed;color:var(--text);font:400 15px/1.5 Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
small,.sub{color:var(--muted);font-size:13px}
b{font-weight:500}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.lcard{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:30px 26px}
.logo{width:44px;height:44px;border:1.5px solid var(--green);border-radius:12px;display:grid;place-items:center;color:var(--green);font-weight:700;font-size:20px;flex:none}
.lcard h1{font-size:24px;font-weight:500;margin:20px 0 4px}
.lcard form{margin-top:22px;display:grid;gap:14px}

/* fields + buttons */
.f{display:grid;gap:6px;color:var(--muted);font-size:13px}
.f input,.f select{background:var(--field);border:1px solid var(--line);border-radius:12px;padding:11px 13px;color:var(--text);font-size:15px;width:100%;min-height:44px}
.f input::placeholder{color:#5d6471}
.f input:focus,.f select:focus{border-color:var(--green)}
input[type=datetime-local]{color-scheme:dark}
.err{color:var(--red);font-size:13px;min-height:0}
.err:empty{display:none}
.btn{border:1px solid var(--line);background:transparent;border-radius:12px;padding:10px 16px;min-height:44px;cursor:pointer;font-weight:500;font-size:14px;transition:background .15s,border-color .15s}
.btn:hover{border-color:#44505f}
.btn.primary{background:var(--green);border-color:var(--green);color:#04150d}
.btn.primary:hover{background:#33ffa0}
.btn.danger{color:var(--red);border-color:#5a2a2a}
.btn.danger:hover{background:var(--red-d)}
.btn.ok{color:var(--green);border-color:#176a46}
.btn.ok:hover{background:var(--green-d)}
.btn.sm{padding:6px 12px;min-height:36px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:default}

/* app shell */
.app{min-height:100vh;display:grid;grid-template-columns:248px minmax(0,1fr)}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:22px;padding:22px 14px;background:rgba(16,21,27,.7);border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;padding:0 6px}
.brand b{display:block;font-size:16px;letter-spacing:.02em}
.brand small{display:block;line-height:1.2}
.nav{display:grid;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-radius:12px;padding:11px 12px;min-height:44px;color:var(--muted);cursor:pointer;font-weight:500}
.nav button:hover{background:#171d25;color:var(--text)}
.nav button[aria-current=page]{background:var(--green-d);color:var(--green)}
.nav svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav .cnt{margin-left:auto;background:var(--amber);color:#2a1f00;border-radius:99px;font-size:12px;font-weight:700;padding:1px 8px;min-width:22px;text-align:center}
.sidefoot{margin-top:auto;display:grid;gap:10px}
.chip{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);padding:0 6px}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--amber);flex:none}
.chip.live i{background:var(--green)}
.top{display:none}
main{padding:34px 36px 60px;max-width:1180px;width:100%;outline:0}
.ph{margin-bottom:24px}
.ph h1{font-size:28px;font-weight:500;letter-spacing:-.01em}
.ph p{color:var(--muted);margin-top:4px}

/* dashboard */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
.stat span{color:var(--muted);font-size:13px}
.stat strong{display:block;font-size:30px;font-weight:500;margin:6px 0 2px;letter-spacing:-.01em}
.stat small{display:block}
.stat.warn{border-color:#6b5514;background:linear-gradient(180deg,#241d08,var(--card) 70%)}
.stat.warn strong{color:var(--amber)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px}
.panel h2{font-size:17px;font-weight:500;margin-bottom:14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row>div{min-width:0}
.row b,.row small{display:block;overflow:hidden;text-overflow:ellipsis}
.empty{color:var(--muted);padding:14px 0}
.foot{margin-top:22px;display:flex;gap:12px;align-items:center;color:var(--muted);font-size:13px;flex-wrap:wrap}

/* badges */
.badge{display:inline-block;font-size:12px;font-weight:500;padding:2px 10px;border-radius:99px;white-space:nowrap}
.b-live,.b-approved,.b-active{background:var(--green-d);color:var(--green)}
.b-upcoming{background:var(--blue-d);color:var(--blue)}
.b-pending{background:var(--amber-d);color:var(--amber)}
.b-completed{background:#232833;color:var(--muted)}
.b-cancelled,.b-rejected,.b-blocked{background:var(--red-d);color:var(--red)}

/* forms */
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:end}
.grid .span2{grid-column:span 2}
.grid .full{grid-column:1/-1}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.toolbar .f{flex:1;min-width:200px}
.seg{display:inline-flex;background:var(--field);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{background:none;border:0;border-radius:9px;padding:8px 14px;min-height:38px;color:var(--muted);cursor:pointer;font-weight:500;font-size:14px}
.seg button[aria-pressed=true]{background:var(--green-d);color:var(--green)}

/* matches */
.mlist{display:grid;gap:14px;margin-top:18px}
.match{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
.match.is-live{border-color:#176a46}
.mh{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.mh h3{font-size:17px;font-weight:500}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:16px 0;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.facts div span{display:block;color:var(--muted);font-size:12px}
.facts div b{font-size:16px}
.room{display:grid;grid-template-columns:1fr 1fr auto;gap:12px;align-items:end}
.macts{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}

/* tables */
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;color:var(--muted);font-weight:400;font-size:13px;padding:0 12px 10px}
.tbl td{padding:13px 12px;border-top:1px solid var(--line);vertical-align:middle}
.tbl td small{display:block}
.tbl .r{text-align:right}
.tbl .act{text-align:right;white-space:nowrap}
.tbl .act .btn+.btn{margin-left:8px}
.tw{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px 8px 4px}

/* dialog + toast */
dialog{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:20px;padding:0;width:min(460px,calc(100vw - 28px));max-height:calc(100vh - 40px);overflow:auto}
dialog::backdrop{background:rgba(2,6,5,.72)}
.dlgf{padding:24px;display:grid;gap:14px}
.dlgf h3{font-size:19px;font-weight:500}
.drow{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.winrow{display:grid;grid-template-columns:42px 1fr 110px;gap:10px;align-items:center}
.winrow select,.winrow input{background:var(--field);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-height:42px;width:100%;color:var(--text)}
.place{color:var(--muted);font-size:14px}
.hint{color:var(--muted);font-size:13px}
#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);background:#e9fff4;color:#04150d;padding:11px 18px;border-radius:12px;font-weight:500;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100vw - 32px);z-index:50;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.bad{background:#ffe3e3;color:#3a0b0b}

/* tablet + mobile */

/* results review */
.sumbar{display:flex;gap:6px 16px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.srow{display:grid;grid-template-columns:132px minmax(0,1fr) auto;gap:16px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.sthumb{width:132px;height:92px;border-radius:12px;overflow:hidden;background:var(--field);display:grid;place-items:center;color:var(--muted);font-size:12px;cursor:zoom-in}
.sthumb img{width:100%;height:100%;object-fit:cover;display:block}
.sinfo{display:grid;gap:4px;min-width:0;justify-items:start}
.sinfo small{display:block;color:var(--muted);font-size:13px}
.sacts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.flag{display:inline-block;background:var(--amber-d);color:var(--amber);font-size:12px;border-radius:8px;padding:2px 8px}
.bigimg{max-width:100%;max-height:70vh;border-radius:12px;display:block;margin:0 auto}
.kvr{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid var(--line)}
.kvr:first-child{border-top:0}
.opt{display:block;width:100%;text-align:left;background:var(--field);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:44px;cursor:pointer}
.opt:hover{border-color:#44505f}
@media(max-width:600px){.srow{grid-template-columns:96px minmax(0,1fr)}.sthumb{width:96px;height:72px}.sacts{grid-column:1/-1;justify-content:stretch}.sacts .btn{flex:1}}

@media(max-width:1020px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.facts{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:860px){
 .app{grid-template-columns:minmax(0,1fr)}
 .side{position:static;height:auto;padding:0;border:0;background:none}
 .side .brand,.side .sidefoot{display:none}
 .nav{position:fixed;left:0;right:0;bottom:0;z-index:20;grid-auto-flow:column;grid-auto-columns:1fr;gap:0;background:rgba(13,17,22,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
 .nav button{flex-direction:column;gap:3px;padding:7px 4px;font-size:11.5px;text-align:center;justify-content:center;position:relative}
 .nav .cnt{position:absolute;top:2px;left:calc(50% + 6px);margin:0;font-size:10px;padding:0 6px;min-width:18px}
 .top{display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:10;padding:12px 16px;background:rgba(5,13,11,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
 .top .brand b{font-size:15px}
 main{padding:20px 16px 110px}
 .ph h1{font-size:24px}
}
@media(max-width:760px){
 .two{grid-template-columns:minmax(0,1fr)}
 .room{grid-template-columns:1fr 1fr}.room .btn{grid-column:1/-1}
 .tbl thead{display:none}
 .tbl,.tbl tbody,.tbl tr,.tbl td{display:block}
 .tw{padding:10px;background:none;border:0}
 .tbl tr{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 14px;margin-bottom:10px}
 .tbl td{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:6px 0;border:0;text-align:right}
 .tbl td::before{content:attr(data-l);color:var(--muted);text-align:left;font-size:13px;flex:none}
 .tbl td.act{justify-content:flex-end;padding-top:10px}
 .tbl td.act::before{content:none}
}
@media(max-width:520px){
 .stats{gap:10px}.stat{padding:14px}.stat strong{font-size:24px}
 .grid{grid-template-columns:minmax(0,1fr)}.grid .span2{grid-column:auto}
 .facts{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

</style>
</head>
<body>
<!-- ============ LOGIN ============ -->
<div id="login" class="login">
  <div class="lcard">
    <div class="logo" aria-hidden="true">G</div>
    <h1>Admin sign in</h1>
    <p class="sub">GAMERZONE control panel. Authorised staff only.</p>
    <form id="lform" autocomplete="off" novalidate>
      <label class="f" id="lemailw" hidden>Email<input id="lemail" type="email" autocomplete="username" placeholder="admin@yourdomain.com" value="gamerzone.help@gmail.com"></label>
      <label class="f">Password<input id="lpw" type="password" autocomplete="current-password" placeholder="Enter admin password" required></label>
      <p class="err" id="lerr" role="alert"></p>
      <button class="btn primary" id="lbtn">Sign in</button>
    </form>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app" class="app" hidden>
  <aside class="side">
    <div class="brand"><span class="logo" aria-hidden="true">G</span><div><b>GAMERZONE</b><small>Admin panel</small></div></div>
    <nav class="nav" id="nav" aria-label="Sections"></nav>
    <div class="sidefoot">
      <span class="chip" id="modeChip"><i></i><span></span></span>
      <button class="btn" id="logout">Log out</button>
    </div>
  </aside>
  <header class="top">
    <div class="brand"><span class="logo" aria-hidden="true">G</span><div><b>GAMERZONE</b><small id="modeTxt"></small></div></div>
    <button class="btn sm" id="logout2">Log out</button>
  </header>
  <main id="main" tabindex="-1"></main>
</div>

<dialog id="dlg"></dialog>
<div id="toast" role="status" aria-live="polite"></div>


<script>
/* =====================================================================
   GAMERZONE DATA LAYER  (this exact block is inside BOTH GAMERZONE.html
   and admin.html, so the app and the admin panel talk to the same data)

   BACKEND 'local'    : data is kept in this browser (localStorage). The app and the
                        admin panel share it when both pages are opened from the same
                        place (same folder / same website) in the same browser.
                        Use this to test everything before you add services.
   BACKEND 'firebase' : data is kept in your Firebase Realtime Database, so every
                        phone and the admin panel see the same live data.
                        To switch: set BACKEND to 'firebase' and fill in FIREBASE below.
                        Do this in BOTH files.

   DATA SHAPE
     users/{id}            name, phone, state, dob, wallet, bonus, status('active'|'blocked'),
                           joinedAt, earned, wins, battles, refCode, referredBy
     auth/{id}             hash            (password check; replace with Firebase Auth later)
     matches/{id}          name, game('FREE FIRE'|'BGMI'), mode, fee, prizes[], slots, minPlayers,
                           startAt, durationMin, vipSlots, joined, vipJoined, roomId, roomPass,
                           status('upcoming'|'completed'|'cancelled'), results[], createdAt
     entries/{match}/{id}  name, ign, gameUid, paid, joinedAt, refunded, vip     (admin view)
     myEntries/{id}/{match}  same record, for the player's own app
     payments/{id}         uid, type('deposit'|'withdrawal'), amount, method, ref, status, createdAt,
                           handledAt, note
     utr/{utr}             payment id   (stops one UTR being used twice)
     submissions/{match}_{id}  matchId, uid, name, gameUid, rank, kills, imgId, status, why, createdAt
     img/{imgId}           screenshot as a data URL
     leaderboard/{id}      n, earned, wins
     referrals/{id}/{friend}   name, paid
     refCodes/{code}       user id
     config/payment        upiId, upiName, minDeposit, minWithdraw, supportEmail
     userState/{id}        the player's own app data (profile, posts, history)
   ===================================================================== */
const GZ_CONFIG = {
  BACKEND: 'firebase',
  FIREBASE: {
    apiKey: 'AIzaSyAr2IKLImYwVgwKe0vV1_9uJNWVwkPsiU4',
    authDomain: 'gamerzone-30d34.firebaseapp.com',
    databaseURL: 'https://gamerzone-30d34-default-rtdb.asia-southeast1.firebasedatabase.app',
    projectId: 'gamerzone-30d34',
    storageBucket: 'gamerzone-30d34.firebasestorage.app',
    messagingSenderId: '345682890290',
    appId: '1:345682890290:web:30c0bc67ccff3315e0362b'
  },
  FIREBASE_SDK: 'https://www.gstatic.com/firebasejs/10.12.2/'
};

const DB = (() => {
  const useFb = GZ_CONFIG.BACKEND === 'firebase' && !/YOUR_/.test(Object.values(GZ_CONFIG.FIREBASE).join(' '));
  const parts = p => String(p).split('/').filter(Boolean);
  const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const filt = (v, f, x) => {
    if (!v || typeof v !== 'object') return null;
    const o = {};
    Object.keys(v).forEach(k => { if (v[k] && v[k][f] === x) o[k] = v[k]; });
    return o;
  };

  /* ---------------- local (browser) backend ---------------- */
  const LOCAL = (() => {
    const P = 'gzdb:', SPLIT = {userState: 1, img: 1};
    const watchers = [];
    const keyOf = (top, id) => P + top + (SPLIT[top] && id != null ? ':' + id : '');
    const rd = k => { try { const r = localStorage.getItem(k); return r == null ? undefined : JSON.parse(r); } catch (e) { return undefined; } };
    const wr = (k, v) => {
      try { if (v === undefined) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); return true; }
      catch (e) { return false; }
    };
    function get(path) {
      const a = parts(path); if (!a.length) return undefined;
      let node, rest;
      if (SPLIT[a[0]]) { if (a.length < 2) return undefined; node = rd(keyOf(a[0], a[1])); rest = a.slice(2); }
      else { node = rd(keyOf(a[0])); rest = a.slice(1); }
      for (const k of rest) { if (node == null || typeof node !== 'object') return undefined; node = node[k]; }
      return node;
    }
    function set(path, val) {
      const a = parts(path); let key, rest;
      if (SPLIT[a[0]]) { key = keyOf(a[0], a[1]); rest = a.slice(2); } else { key = keyOf(a[0]); rest = a.slice(1); }
      if (val === null) val = undefined;
      if (!rest.length) { if (!wr(key, val)) throw new Error('Browser storage is full. Clear some data and try again.'); return; }
      let root = rd(key); if (root == null || typeof root !== 'object') root = {};
      let o = root;
      for (let i = 0; i < rest.length - 1; i++) { if (o[rest[i]] == null || typeof o[rest[i]] !== 'object') o[rest[i]] = {}; o = o[rest[i]]; }
      const last = rest[rest.length - 1];
      if (val === undefined) delete o[last]; else o[last] = val;
      if (!wr(key, root)) throw new Error('Browser storage is full. Clear some data and try again.');
    }
    function notify() {
      watchers.slice().forEach(w => {
        let v = get(w.path);
        if (w.field !== undefined) v = filt(v, w.field, w.val);
        const s = JSON.stringify(v === undefined ? null : v);
        if (s !== w.last) { w.last = s; try { w.cb(v === undefined ? null : JSON.parse(s)); } catch (e) { console.error(e); } }
      });
    }
    const later = () => Promise.resolve().then(notify);
    addEventListener('storage', e => { if (e.key && e.key.indexOf(P) === 0) notify(); });
    return {
      async init() {},
      async get(p) { const v = get(p); return v === undefined ? null : JSON.parse(JSON.stringify(v)); },
      async set(p, v) { set(p, v); later(); },
      async update(p, o) { Object.keys(o).forEach(k => set(p + '/' + k, o[k])); later(); },
      async inc(p, d, o) {
        o = o || {};
        const min = o.min == null ? -Infinity : o.min, max = o.max == null ? Infinity : o.max;
        const n = (Number(get(p)) || 0) + d;
        if (n < min || n > max) return false;
        set(p, n); later(); return true;
      },
      async claim(p, from, to) {
        const c = get(p);
        if (from === null ? c != null : c !== from) return false;
        set(p, to); later(); return true;
      },
      watch(p, cb, field, val) {
        const w = {path: p, cb, field, val, last: undefined};
        watchers.push(w);
        Promise.resolve().then(() => {
          let v = get(p); if (field !== undefined) v = filt(v, field, val);
          w.last = JSON.stringify(v === undefined ? null : v);
          cb(v === undefined ? null : JSON.parse(w.last));
        });
        return () => { const i = watchers.indexOf(w); if (i >= 0) watchers.splice(i, 1); };
      },
      async wipe() {
        const rm = [];

function bindHostForm() {

  f.elements.when.min = n.getFullYear() + '-' + pad(n.getMonth() + 1) + '-' + pad(n.getDate()) + 'T' + pad(n.getHours()) + ':' + pad(n.getMinutes());

  f.onsubmit = async e => {
    e.preventDefault();
    const v = k => f.elements[k].value.trim(), er = $('#nmerr'), bad = m => { er.textContent = m; };
    const name = v('name'), fee = Number(v('fee')), slots = Number(v('slots')), minp = Number(v('minp')), vip = Number(v('vip')), dur = Number(v('dur'));

    if (!prizes.every(x => Number.isInteger(x) && x >= 0) || prizes[0] < 1) return bad('Enter a 1st prize of at least ₹1. Other prizes are whole numbers.');
    if (prizes[2] > 0 && prizes[1] === 0) return bad('Add a 2nd prize before a 3rd prize.');
    if (!Number.isInteger(slots) || slots < 2 || slots > 200) return bad('Slots must be between 2 and 200.');
    if (!Number.isInteger(minp) || minp < 2 || minp > slots) return bad('Minimum players must be between 2 and the total slots.');

    if (!Number.isInteger(dur) || dur < 10 || dur > 180) return bad('Match length must be 10 to 180 minutes.');
    if (!startAt || startAt < Date.now() - 6e4) return bad('Pick a start time in the future.');
    er.textContent = '';
    const id = DB.newId();
    try {
      await DB.set('matches/' + id, {name, game: v('game'), mode: v('mode'), fee, prizes: prizes.filter(x => x > 0), slots, minPlayers: minp, startAt, durationMin: dur, vipSlots: vip, joined: 0, vipJoined: 0, roomId: '', roomPass: '', status: 'upcoming', createdAt: Date.now()});

function flagsFor(s) {

  if (o.some(x => x.rank === s.rank && x.status !== 'rejected') && s.status !== 'rejected') f.push('Rank #' + s.rank + ' claimed by more than one player');

function winnersOf(m) {

  const rk = ap.map(s => s.rank); if (new Set(rk).size !== rk.length) return 'Two approved players claim the same rank. Reject one of them.';
  const w = winnersOf(m);
  for (const s of w) { const u = D.users[s.uid]; if (!u) return s.name + ' no longer has an account.'; if (u.status === 'blocked') return s.name + ' is blocked. Unblock them or reject their result.'; }

}

      '<div class="sacts">' + (done ? '' : s.status === 'pending' ? '<button class="btn ok sm" data-act="sapp">Approve</button><button class="btn danger sm" data-act="srej">Reject</button>' : '<button class="btn sm" data-act="sund">Undo</button>') + '</div></div>';

  const err = checkDeclare(m); if (err) return toast(err, true);
  const w = winnersOf(m), total = w.reduce((a, s, i) => a + m.prizes[i], 0);
  const ok = await ask({title: 'Pay ' + inr(total) + ' to the winners?', ok: 'Pay prizes', body: w.map((s, i) => '<div class="kvr"><span>' + ['1st', '2nd', '3rd'][i] + ' ' + esc(s.name) + '</span><b>' + inr(m.prizes[i]) + '</b></div>').join('') + '<p style="margin:10px 0 0">The money goes to their wallets straight away. This cannot be undone.</p>'});
  if (!ok) return;
  if (!(await DB.claim('matches/' + m.id + '/status', m.status, 'completed'))) return toast('This match was already changed.', true);
  const res = w.map((s, i) => ({place: i + 1, uid: s.uid, name: s.name, prize: m.prizes[i]}));
  await DB.update('matches/' + m.id, {results: res, completedAt: Date.now()});
  for (const r of res) {
    await DB.inc('users/' + r.uid + '/wallet', r.prize, {min: 0});
    await DB.inc('users/' + r.uid + '/earned', r.prize, {min: 0});
    if (r.place === 1) await DB.inc('users/' + r.uid + '/wins', 1, {min: 0});
    const u = await DB.get('users/' + r.uid);
    await DB.update('leaderboard/' + r.uid, {n: u.name, earned: u.earned || 0, wins: u.wins || 0});
  }
  toast('Winners declared. ' + inr(total) + ' paid.');
}

/* ---------- users ---------- */
function renderUseg() {
  const el = $('#useg'); if (!el) return; const U = list(D.users);
  el.innerHTML = segHtml([['all', 'All (' + U.length + ')'], ['active', 'Active'], ['blocked', 'Blocked (' + U.filter(u => u.status === 'blocked').length + ')']], F.uf);
}
function usersHtml() {
  const q = F.uq.trim().toLowerCase();
  const U = list(D.users).filter(u => (F.uf === 'all' || u.status === F.uf) && (!q || [u.name, u.phone, u.state].some(x => String(x || '').toLowerCase().includes(q)))).sort((a, b) => (b.joinedAt || 0) - (a.joinedAt || 0));
  if (!U.length) return '<p class="empty">' + (list(D.users).length ? 'No users match this search.' : 'No players have signed up yet.') + '</p>';
  return '<div class="tw"><table class="tbl"><thead><tr><th>Player</th><th>State</th><th>Joined</th><th class="r">Wallet</th><th class="r">Won</th><th>Status</th><th></th></tr></thead><tbody>' +
    U.map(u => '<tr data-uid="' + esc(u.id) + '"><td data-l="Player"><span><b>' + esc(u.name) + '</b><small>' + esc(u.phone || '') + '</small></span></td><td data-l="State">' + esc(u.state || '-') + '</td><td data-l="Joined">' + day(u.joinedAt) + '</td><td data-l="Wallet" class="r"><b>' + inr(u.wallet) + '</b></td><td data-l="Won" class="r">' + inr(u.earned) + '</td><td data-l="Status"><span class="badge b-' + (u.status === 'blocked' ? 'blocked' : 'active') + '">' + (u.status === 'blocked' ? 'Blocked' : 'Active') + '</span></td><td class="act">' +
      (u.status === 'blocked' ? '<button class="btn ok sm" data-act="unblock">Unblock</button>' : '<button class="btn danger sm" data-act="block">Block</button>') + '</td></tr>').join('') + '</tbody></table></div>';
}
async function setBlocked(uid, block) {
  const u = D.users[uid]; if (!u) return;
  if (!(await ask({title: (block ? 'Block ' : 'Unblock ') + u.name + '?', body: block ? 'They will see an "Account suspended" screen in the app and cannot join, add money or withdraw. Pending requests cannot be approved while blocked.' : 'They can play and use their wallet again.', ok: block ? 'Block user' : 'Unblock user', danger: block}))) return;
  await DB.update('users/' + uid, block ? {status: 'blocked', blockedAt: Date.now()} : {status: 'active', blockedAt: null});
  toast(u.name + (block ? ' is blocked' : ' is unblocked'));
}

/* ---------- payments ---------- */
function renderPseg() {
  const P = list(D.payments), c = (t, s) => P.filter(p => p.type === t && p.status === s).length;
  $('#ptseg').innerHTML = segHtml([['withdrawal', 'Withdrawals (' + c('withdrawal', 'pending') + ' pending)'], ['deposit', 'Deposits (' + c('deposit', 'pending') + ' pending)']], F.ptype);
  $('#psseg').innerHTML = segHtml([['pending', 'Pending'], ['approved', 'Approved'], ['rejected', 'Rejected'], ['all', 'All']], F.pst);
}
function payHtml() {
  const P = list(D.payments).filter(p => p.type === F.ptype && (F.pst === 'all' || p.status === F.pst)).sort((a, b) => F.pst === 'pending' ? a.createdAt - b.createdAt : b.createdAt - a.createdAt);
  if (!P.length) return '<p class="empty">No ' + (F.pst === 'all' ? '' : F.pst + ' ') + (F.ptype === 'deposit' ? 'deposit' : 'withdrawal') + ' requests.</p>';
  return '<div class="tw"><table class="tbl"><thead><tr><th>Player</th><th class="r">Amount</th><th>' + (F.ptype === 'deposit' ? 'UTR number' : 'Pay out to') + '</th><th>Requested</th><th>Status</th><th></th></tr></thead><tbody>' +
    P.map(p => {
      const u = D.users[p.uid] || {name: 'Unknown user', wallet: 0};
      return '<tr data-pid="' + esc(p.id) + '"><td data-l="Player"><span><b>' + esc(u.name) + (u.status === 'blocked' ? ' (blocked)' : '') + '</b><small>Wallet ' + inr(u.wallet) + '</small></span></td><td data-l="Amount" class="r"><b>' + inr(p.amount) + '</b></td><td data-l="' + (F.ptype === 'deposit' ? 'UTR' : 'Pay out to') + '">' + esc(p.ref || '-') + '</td><td data-l="Requested">' + when(p.createdAt) + '</td>' +
        '<td data-l="Status"><span><span class="badge b-' + p.status + '">' + ({pending: 'Pending', approved: 'Approved', rejected: 'Rejected'}[p.status] || esc(p.status)) + '</span>' + (p.note ? '<small>' + esc(p.note) + '</small>' : '') + '</span></td>' +
        '<td class="act">' + (p.imgId ? '<button class="btn sm" data-act="pshot">Screenshot</button>' : '') + (p.status === 'pending' ? '<button class="btn ok sm" data-act="approve">Approve</button><button class="btn danger sm" data-act="reject">Reject</button>' : '') + '</td></tr>';
    }).join('') + '</tbody></table></div>';
}
async function approvePay(id) {
  const p = D.payments[id]; if (!p || p.status !== 'pending') return;
  const u = D.users[p.uid]; if (!u) return toast('This user no longer exists.', true);
  if (u.status === 'blocked') return toast('This user is blocked. Unblock them first.', true);
  const wd = p.type === 'withdrawal', deduct = wd && CONFIG.WITHDRAW_DEDUCT_ON_APPROVE;
  if (deduct && (u.wallet || 0) < p.amount) return toast('Wallet has only ' + inr(u.wallet) + '. Cannot pay ' + inr(p.amount) + '.', true);
  const ok = await ask({title: (wd ? 'Approve withdrawal of ' : 'Approve deposit of ') + inr(p.amount) + '?', ok: 'Approve',
    body: wd ? 'Send <b>' + inr(p.amount) + '</b> to UPI ID <b>' + esc(p.ref) + '</b> (' + esc(u.name) + ') from your bank or UPI app first, then approve. The amount was already held from their wallet.' : 'Check that UTR <b>' + esc(p.ref) + '</b> for ' + inr(p.amount) + ' really reached your account. The money is added to ' + esc(u.name) + '\u2019s wallet.'});
  if (!ok) return;
  if (!(await DB.claim('payments/' + id + '/status', 'pending', 'approved'))) return toast('Someone already handled this request.', true);
  let applied = true;
  if (!wd) applied = await DB.inc('users/' + p.uid + '/wallet', p.amount, {min: 0});
  else if (deduct) applied = await DB.inc('users/' + p.uid + '/wallet', -p.amount, {min: 0});
  if (!applied) { await DB.set('payments/' + id + '/status', 'pending'); return toast('Wallet could not be updated, so the request is back in pending.', true); }
  await DB.update('payments/' + id, {handledAt: Date.now()});
  toast(wd ? 'Withdrawal approved' : 'Deposit approved, wallet credited');
}
async function rejectPay(id) {
  const p = D.payments[id]; if (!p || p.status !== 'pending') return;
  const reason = await ask({title: 'Reject ' + p.type + ' of ' + inr(p.amount) + '?', body: 'The player will see the reason you enter.' + (p.type === 'withdrawal' && !CONFIG.WITHDRAW_DEDUCT_ON_APPROVE ? ' The held money goes back to their wallet.' : ''), ok: 'Reject request', danger: true, field: {label: 'Reason', ph: 'e.g. Payment not found', max: 80, req: true}});
  if (reason === false) return;
  if (!(await DB.claim('payments/' + id + '/status', 'pending', 'rejected'))) return toast('Someone already handled this request.', true);
  if (p.type === 'withdrawal' && !CONFIG.WITHDRAW_DEDUCT_ON_APPROVE) await DB.inc('users/' + p.uid + '/wallet', p.amount, {min: 0});
  await DB.update('payments/' + id, {handledAt: Date.now(), note: reason});
  toast('Request rejected');
}

function bindSettings() {
  $('#cf').onsubmit = async e => {
    e.preventDefault(); const f = e.target, v = k => f.elements[k].value.trim(), er = $('#cferr');
    const o = {upiId: v('upiId'), upiName: v('upiName'), minDeposit: +v('minDeposit'), maxDeposit: +v('maxDeposit'), minWithdraw: +v('minWithdraw'), maxWithdraw: +v('maxWithdraw'), supportEmail: v('supportEmail')};
    if (o.upiId && !/^[\w.\-]{2,}@[a-zA-Z]{2,}$/.test(o.upiId)) return er.textContent = 'Enter a valid UPI ID, like name@bank.';
    if (!(o.minDeposit >= 1 && o.maxDeposit >= o.minDeposit)) return er.textContent = 'Check the deposit limits.';
    if (!(o.minWithdraw >= 1 && o.maxWithdraw >= o.minWithdraw)) return er.textContent = 'Check the withdrawal limits.';
    er.textContent = '';
    try { await DB.set('config/payment', o); toast('Settings saved'); } catch (x) { er.textContent = 'Could not save: ' + x.message; }
  };
}

/* ---------- one click handler ---------- */
document.addEventListener('click', async e => {
  const t = e.target.closest('button, [data-act]'); if (!t) return;
  try {
    if (t.dataset.view) return setView(t.dataset.view);
    if (t.dataset.go) return setView(t.dataset.go);
    if (t.closest('#mseg') && t.dataset.v) { F.mf = t.dataset.v; renderMseg(); return renderBody(); }
    if (t.closest('#useg') && t.dataset.v) { F.uf = t.dataset.v; renderUseg(); return renderBody(); }
    if (t.closest('#ptseg') && t.dataset.v) { F.ptype = t.dataset.v; renderPseg(); return renderBody(); }
    if (t.closest('#psseg') && t.dataset.v) { F.pst = t.dataset.v; renderPseg(); return renderBody(); }
    const a = t.dataset.act; if (!a) return;
    const card = t.closest('[data-mid]'), m = card && D.matches[card.dataset.mid] && Object.assign({id: card.dataset.mid}, D.matches[card.dataset.mid]);
    if (a === 'room' && m) return saveRoom(card, m);
    if (a === 'cancel' && m) return cancelMatch(m);
    if (a === 'players' && m) return showPlayers(m);
    if (a === 'review' && m) { F.rm = m.id; return setView('results'); }
    const row = t.closest('tr'), sc = t.closest('[data-sid]'), s = sc && D.submissions[sc.dataset.sid] && Object.assign({id: sc.dataset.sid}, D.submissions[sc.dataset.sid]);
    if (a === 'zoom' && s) { const u = IMGC[s.imgId]; if (!u) return toast('Screenshot is still loading'); openDlg('<div class="dlgf"><h3>' + esc(s.name) + ' · rank #' + s.rank + ', ' + s.kills + ' kills</h3><img class="bigimg" src="' + u + '" alt="Result screenshot"><div class="drow"><button type="button" class="btn" data-x>Close</button></div></div>'); return; }
    if (a === 'pshot' && row) {
      const p = D.payments[row.dataset.pid]; if (!p || !p.imgId) return;
      let u = IMGC[p.imgId]; if (!u) { toast('Loading screenshot...'); u = await DB.getImage(p.imgId); if (u) IMGC[p.imgId] = u; }
      if (!u) return toast('Screenshot not found', true);
      const who = D.users[p.uid] ? D.users[p.uid].name : 'Unknown user';
      openDlg('<div class="dlgf"><h3>' + esc(who) + ' · ' + inr(p.amount) + '</h3><p style="margin:0 0 10px">UTR: <b>' + esc(p.ref || '-') + '</b></p><img class="bigimg" src="' + u + '" alt="Payment screenshot"><div class="drow"><button type="button" class="btn" data-x>Close</button></div></div>'); return;
    }
    if (a === 'sapp' && s) return setSub(s, 'approved');
    if (a === 'sund' && s) return setSub(s, 'pending');
    if (a === 'srej' && s) { const why = await pickReason(); if (why) setSub(s, 'rejected', why); return; }
    if (a === 'declare') return declare(Object.assign({id: F.rm}, D.matches[F.rm]));
    if (a === 'block' || a === 'unblock') return setBlocked(row.dataset.uid, a === 'block');
    if (a === 'approve') return approvePay(row.dataset.pid);
    if (a === 'reject') return rejectPay(row.dataset.pid);
    if (a === 'demo') { if (await ask({title: 'Restore demo data?', body: 'This deletes everything and puts back the demo players, matches, payments and screenshots.', ok: 'Restore', danger: true})) { await DB.reset('demo'); toast('Demo data restored'); } return; }
    if (a === 'fresh') { const v = await ask({title: 'Delete everything?', body: 'This removes all matches, players, wallets, payments and screenshots. Use it once, before you launch. Type <b>DELETE</b> to confirm.', ok: 'Delete everything', danger: true, field: {label: 'Type DELETE', req: true, max: 10}}); if (v === 'DELETE') { await DB.reset('fresh'); toast('Everything deleted. You are starting fresh.'); } else if (v !== false) toast('Nothing was deleted. You must type DELETE.', true); return; }
  } catch (x) { console.error(x); toast('Something went wrong: ' + (x.message || x), true); }
});

/* ---------- login, session, idle timeout ---------- */
let fails = 0, lastAct = Date.now(), idleT = null;
const SESSION = 'gz_admin_until';
const lockUntil = () => Number(tryLs(() => localStorage.getItem('gz_admin_lock')) || 0);
function enter() {
  $('#login').hidden = true; $('#app').hidden = false;
  tryLs(() => sessionStorage.setItem(SESSION, String(Date.now() + CONFIG.IDLE_MINUTES * 6e4)));
  lastAct = Date.now(); clearInterval(idleT);
  idleT = setInterval(() => { if (Date.now() - lastAct > CONFIG.IDLE_MINUTES * 6e4) leave('You were logged out after ' + CONFIG.IDLE_MINUTES + ' minutes of inactivity.'); }, 15000);
  startWatch(); setView(view);
}
async function leave(msg) {
  clearInterval(idleT); tryLs(() => sessionStorage.removeItem(SESSION)); stopWatch();
  if (DB.mode === 'firebase' && CONFIG.USE_FIREBASE_AUTH) { try { await firebase.auth().signOut(); } catch (x) {} }
  $('#app').hidden = true; $('#login').hidden = false; $('#lpw').value = ''; $('#lerr').textContent = msg || '';
  const d = $('#dlg'); if (d.open) d.close('cancel');
}
['click', 'keydown', 'touchstart', 'pointermove'].forEach(ev => document.addEventListener(ev, () => { lastAct = Date.now(); }, {passive: true}));
$('#lform').onsubmit = async e => {
  e.preventDefault();
  const er = $('#lerr'), btn = $('#lbtn'), pw = $('#lpw').value; er.textContent = '';
  const wait = lockUntil() - Date.now();
  if (wait > 0) { er.textContent = 'Too many attempts. Try again in ' + Math.ceil(wait / 1000) + ' seconds.'; return; }
  if (!pw) { er.textContent = 'Enter the password.'; return; }
  btn.disabled = true;
  try {
    if (CONFIG.USE_FIREBASE_AUTH && DB.mode === 'firebase') await firebase.auth().signInWithEmailAndPassword($('#lemail').value.trim(), pw);
    else { if ((await sha256(pw)) !== CONFIG.ADMIN_PASS_SHA256) throw new Error('bad'); enter(); }
    fails = 0;
  } catch (x) {
    const code = (x && x.code) || '';
    const bad = !code || /invalid-credential|wrong-password|user-not-found|invalid-email|invalid-login/.test(code) || x.message === 'bad';
    if (x.message === 'nocrypto') er.textContent = 'This browser blocks secure login on this address. Open the page over https or localhost.';
    else if (!bad) {
      const why = {
        'auth/operation-not-allowed': 'Email/Password sign-in is switched off in Firebase (Authentication, Sign-in method).',
        'auth/unauthorized-domain': 'This website address is not allowed in Firebase (Authentication, Settings, Authorized domains).',
        'auth/operation-not-supported-in-this-environment': 'Login does not work when the file is opened from the phone. Open the https website link instead.',
        'auth/network-request-failed': 'No internet, or the connection to Firebase is blocked.',
        'auth/too-many-requests': 'Firebase has paused logins for a while after too many tries. Wait some minutes and try again.',
        'auth/user-disabled': 'This admin account is disabled in Firebase.',
        'auth/invalid-api-key': 'The Firebase API key in this file is wrong.',
        'auth/api-key-not-valid.-please-pass-a-valid-api-key.': 'The Firebase API key in this file is wrong.'
      }[code];
      er.textContent = (why || 'Login problem.') + ' (' + code + ')';
    }
    else { fails++; if (fails >= 5) { tryLs(() => localStorage.setItem('gz_admin_lock', String(Date.now() + 30000))); fails = 0; er.textContent = 'Too many attempts. Locked for 30 seconds.'; } else er.textContent = (CONFIG.USE_FIREBASE_AUTH ? 'Wrong email or password.' : 'Wrong password.') + ' ' + (5 - fails) + ' tries left.'; }
    $('#lpw').select();
  }
  btn.disabled = false;
};
$('#logout').onclick = $('#logout2').onclick = () => leave('');
(async () => {
  try {
    await DB.ready;
    if (DB.mode === 'firebase' && CONFIG.USE_FIREBASE_AUTH) {
      await new Promise((res, rej) => { const s = document.createElement('script'); s.src = GZ_CONFIG.FIREBASE_SDK + 'firebase-auth-compat.js'; s.onload = res; s.onerror = () => rej(new Error('Could not load sign-in')); document.head.appendChild(s); });
    }
    await DB.ensureSeed();
  } catch (x) { $('#lerr').textContent = 'Could not start: ' + x.message; return; }
  const live = DB.mode === 'firebase';
  $('#modeChip').className = 'chip' + (live ? ' live' : ''); $('#modeChip span').textContent = live ? 'Firebase connected' : 'Test mode, data in this browser';
  $('#modeTxt').textContent = live ? 'Firebase connected' : 'Test mode';
  if (live && CONFIG.USE_FIREBASE_AUTH) {
    $('#lemailw').hidden = false;
    firebase.auth().onAuthStateChanged(u => { if (u && $('#app').hidden) enter(); else if (!u && !$('#app').hidden) leave(''); });
  } else if (Number(tryLs(() => sessionStorage.getItem(SESSION))) > Date.now()) enter();
})();
window.__gzAdmin = {D, F};
