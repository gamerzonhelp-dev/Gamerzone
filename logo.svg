<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f2119"/><stop offset="1" stop-color="#03060a"/></linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2dffa0"/><stop offset="1" stop-color="#00b7ff"/></linearGradient>
<linearGradient id="gf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b8ffe0"/><stop offset=".45" stop-color="#00f08a"/><stop offset="1" stop-color="#00c2e0"/></linearGradient>
<radialGradient id="glow" cx=".5" cy=".5" r=".55"><stop offset="0" stop-color="#00ff88" stop-opacity=".30"/><stop offset="1" stop-color="#00ff88" stop-opacity="0"/></radialGradient>
<filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="9"/></filter>
</defs><rect width="512" height="512" rx="112" fill="url(#bg)"/><g transform="translate(0.0 0.0) scale(1.0)">

<circle cx="256" cy="256" r="240" fill="url(#glow)"/>
